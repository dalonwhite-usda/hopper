[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ghipm"
version = "0.1.0"
description = "Grasshopper economic model"
readme = "ghipm_py/README.md"
requires-python = ">=3.10"
dependencies = [
  "pyomo>=6.7.2",
  "pydantic>=2.7.0",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
]

[tool.setuptools.packages.find]
include = ["ghipm*"]